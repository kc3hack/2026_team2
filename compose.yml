services:
  react-native:
    container_name: myapp-react-native
    tty: true
    build:
      context: ./ReactNative
      dockerfile: ./Dockerfile
    volumes:
      - ./ReactNative:/ReactNative
      - node_modules:/ReactNative/node_modules
    env_file: ./.env
    ports:
      - 8081:8081
volumes:
  node_modules:
