services:
  react-native:
    container_name: myapp-react-native
    tty: true
    build:
      context: ./ReactNative
      dockerfile: ./Dockerfile
    volumes:
      - /ReactNative/node_modules
      - ./ReactNative:/ReactNative
    env_file: ./.env
    ports:
      - 8081:8081
    init: true
  go-server:
    container_name: myapp-go-server
    tty: true
    build:
      context: ./GoServer
      dockerfile: ./Dockerfile
    volumes:
      - ./GoServer:/GoServer
    env_file: ./.env
    ports:
      - 8080:8080
    init: true
  mysql:
    container_name: myapp-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myappdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
  phpmyadmin:
    container_name: myapp-phpmyadmin
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: user
      PMA_PASSWORD: password
    ports:
      - 8082:80
    depends_on:
      - mysql
volumes:
  mysql-data:
